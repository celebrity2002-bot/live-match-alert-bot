name: A-PLUS Live Match Scanner

on:
  workflow_dispatch:
  schedule:
    # Türkiye saatiyle 18:00 - 06:00 arası her 2 saatte bir çalışır (UTC 15:00 - 03:00)
    - cron: '0 15,17,19,21,23,1,3 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
